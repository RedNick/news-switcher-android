# Builds the app's install file (APK) on every change.
#
# - Pull requests: the APK is attached to the workflow run (Actions tab >
#   the run > Artifacts) so it can be tried before merging.
# - Pushes to main: the APK is also published as a GitHub release, so the
#   newest one is always at
#   https://github.com/RedNick/news-switcher-android/releases/latest/download/news-switcher.apk
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # Needed to publish releases.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The signing key is stored as two repo secrets (see README.md). Builds
      # without it still work, but can't update an installed copy.
      - name: Unpack the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing key secret set. This APK can't update an installed copy."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/news-switcher.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/news-switcher.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Give the APK a friendly name
        run: cp app/build/outputs/apk/release/app-release.apk news-switcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: news-switcher-apk
          path: news-switcher.apk

      - name: Publish as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          gh release create "v$VERSION" news-switcher.apk \
            --target "$GITHUB_SHA" \
            --title "News Switcher $VERSION" \
            --notes "Install on a phone or Android TV: see the README."
